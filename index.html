<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>anastasiasimonova.github.io</title>
    <meta name="description" content="Personal page of independent software developer Anastasiia Simonova">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #1b1b1f;
            --muted: #5c5f6b;
            --accent: #6750a4;
            --rule: #e2e2e8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131316;
                --fg: #e5e5ea;
                --muted: #a1a3ae;
                --accent: #cfbcff;
                --rule: #2d2d33;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1.0625rem;
            line-height: 1.65;
        }
        main {
            max-width: 44rem;
            margin: 0 auto;
            padding: 3rem 1.25rem 5rem;
        }
        h1 {
            font-size: clamp(1.7rem, 5vw, 2.15rem);
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin: 0 0 0.5rem;
        }
        .updated {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0 0 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--rule);
        }
        h2 {
            font-size: 1.2rem;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin: 2.75rem 0 0.75rem;
            scroll-margin-top: 1.5rem;
        }
        p { margin: 0 0 1rem; }
        ul { margin: 0 0 1rem; padding-left: 1.3rem; }
        li { margin: 0.45rem 0; }
        strong { font-weight: 600; }
        a {
            color: var(--accent);
            text-underline-offset: 0.15em;
            overflow-wrap: anywhere;
        }
        address {
            font-style: normal;
            margin: 0 0 1rem;
        }
        @media print {
            :root { --bg: #fff; --fg: #000; --muted: #444; --accent: #000; --rule: #bbb; }
            main { max-width: none; padding: 0; }
            h2 { margin-top: 1.6rem; page-break-after: avoid; }
            a { text-decoration: none; }
        }
    </style>
</head>
<body>
<main>
    <p>Welcome to personal page of independent software developer Anastasiia Simonova.</p>
</main>
</body>
</html>
